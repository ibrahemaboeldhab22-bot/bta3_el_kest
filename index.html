<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بتاع القسط — Firebase Cloud</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#171717;--muted:#6b6b6b;--primary:#F4C62E;--primary2:#D9A915;--danger:#b91c1c;--warn:#B8860B;--border:#dedede;--shadow:#00000012;--brand-black:#050505;--brand-gold:#F4C62E;--brand-gold-dark:#D9A915;--brand-white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--brand-black);color:#fff;padding:18px;position:fixed;right:0;top:0;bottom:0;overflow:auto}.brand{font-size:22px;font-weight:800;margin:8px 4px 25px}.brand small{display:block;font-size:11px;color:#a7c8c5;margin-top:5px}.nav button{display:block;width:100%;border:0;background:transparent;color:#d8eeee;text-align:right;padding:12px 13px;border-radius:10px;margin:4px 0}.nav button:hover,.nav button.active{background:#1b1b1b;color:var(--brand-gold);box-shadow:inset -3px 0 0 var(--brand-gold)}.main{margin-right:245px;padding:24px;width:calc(100% - 245px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.title h1{margin:0;font-size:25px}.title p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 13px}.btn.primary{background:var(--brand-gold);color:#111;border-color:var(--brand-gold);font-weight:700}.btn.danger{background:#fff;color:var(--danger);border-color:#fecaca}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:17px}.kpi .label{color:var(--muted);font-size:13px}.kpi .num{font-size:25px;font-weight:800;margin-top:7px}.panel{margin-top:16px}.panel h2{font-size:18px;margin:0 0 12px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:750px}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}.table th{background:#f8fafc;font-size:13px;color:#475569}.table tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#ecfdf5;color:#047857}.badge.warn{background:#fffbeb;color:#b45309}.badge.red{background:#fef2f2;color:#b91c1c}.search{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;margin-bottom:10px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:#fff}.field textarea{min-height:80px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{background:#fff;border-radius:15px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h3{margin:0}.close{border:0;background:#f3f4f6;border-radius:8px;padding:7px 11px}.empty{padding:35px;text-align:center;color:var(--muted)}.row-actions{display:flex;gap:5px}.mini{padding:6px 8px;font-size:12px}.chart{height:230px;display:flex;align-items:end;gap:10px;padding:15px 5px 0}.bar{flex:1;background:var(--brand-gold);border-radius:6px 6px 0 0;min-width:20px;position:relative}.bar span{position:absolute;bottom:100%;right:50%;transform:translateX(50%);font-size:10px;color:var(--muted);margin-bottom:3px}.bar small{position:absolute;top:calc(100% + 5px);right:50%;transform:translateX(50%);font-size:10px;color:var(--muted);white-space:nowrap}.notice{padding:10px 12px;background:#ecfeff;border:1px solid #bae6fd;border-radius:10px;color:#155e75;margin-bottom:12px}.danger-text{color:var(--danger)}@media(max-width:900px){.side{width:72px;padding:10px}.brand{font-size:0;text-align:center}.brand:before{content:'ق';font-size:24px}.brand small{display:none}.nav button{font-size:0;text-align:center;padding:12px 5px}.nav button:before{content:'•';font-size:20px}.main{margin-right:72px;width:calc(100% - 72px);padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}

.brand-logo{text-align:center;margin:2px 0 24px;padding:8px 4px 16px;border-bottom:1px solid #262626}
.brand-logo img{width:132px;height:132px;object-fit:contain;display:block;margin:0 auto 8px;border-radius:10px}
.brand-logo .brand-name{font-size:25px;font-weight:900;color:var(--brand-gold);line-height:1.2}
.brand-logo small{display:block;font-size:11px;color:#bdbdbd;margin-top:7px}
.nav button{transition:.18s ease}
.card{box-shadow:0 8px 28px #00000010}
h1,h2,h3{letter-spacing:-.2px}
.notice{background:#fff9df;border-color:#f0d77a;color:#6d5600}
.brand-strip{height:5px;background:var(--brand-gold);border-radius:0 0 4px 4px;margin:-24px -24px 20px;opacity:.95}.brand-strip span{display:none}.brand-strip b{display:none}</style>

<style>
.firebase-status{display:inline-flex;align-items:center;gap:8px;font-size:13px;margin-top:6px;color:#666}.firebase-status .dot{width:9px;height:9px;border-radius:50%;background:#999;display:inline-block}.firebase-status.ok{color:#176b3a}.firebase-status.ok .dot{background:#1f9d55}.firebase-status.err{color:#a51d2d}.firebase-status.err .dot{background:#c92a2a}.firebase-status.local{color:#8a5a00}.firebase-status.local .dot{background:#d99a00}
</style>

let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;

db.contracts=(db.contracts||[]).map(c=>({...c,collectorName:c.collectorName||'',notes:c.notes||''}));

const date=v=>{if(!v)return ''; const d=new Date(v); return isNaN(d)?String(v):d.toLocaleDateString('ar-EG')};
const iso=v=>{if(!v)return ''; const d=new Date(v); return isNaN(d)?v:d.toISOString().slice(0,10)};

function updateCustomerStatuses(){
  const today=new Date();
  today.setHours(0,0,0,0);

  (db.customers||[]).forEach(c=>{
    const contracts=(db.contracts||[]).filter(x=>x.customerCode===c.code);

    if(!contracts.length){
      c.status='نشط';
      return;
    }

    const hasOverdue=(db.installments||[]).some(x=>{
      if(x.customerCode!==c.code || Number(x.remaining||0)<=0) return false;
      const due=new Date(x.dueDate);
      if(isNaN(due)) return false;
      due.setHours(0,0,0,0);
      return due < today;
    });

    const totalRemaining=contracts.reduce((sum,x)=>sum+Number(x.remaining||0),0);

    if(totalRemaining<=0){
      c.status='خالص';
    }else if(hasOverdue){
      c.status='خامل';
    }else{
      c.status='نشط';
    }
  });
}

function go(p){page=p;nav();render()}
function render(){updateCustomerStatuses();nav();let el=document.getElementById('view');let map={dashboard:dashboard,customers:customers,contracts:contracts,installments:installments,payments:payments,expenses:expenses,capital:capital,reports:reports,customerLookup:customerLookup};document.getElementById('pageTitle').textContent=({dashboard:'لوحة التحكم',customers:'العملاء',contracts:'العقود',installments:'جدول الأقساط',payments:'التحصيل اليومي',expenses:'المصاريف',capital:'حركة رأس المال',reports:'التقارير',customerLookup:'كود العميل'})[page];document.getElementById('pageDesc').textContent='إدارة الأقساط والعملاء — بتاع القسط';el.innerHTML=map[page]()}
function totals(){let contractTotal=db.contracts.reduce((a,x)=>a+Number(x.total||0),0), remaining=db.contracts.reduce((a,x)=>a+Number(x.remaining||0),0), paid=db.payments.reduce((a,x)=>a+Number(x.amount||0),0), exp=db.expenses.reduce((a,x)=>a+Number(x.amount||0),0), overdue=db.installments.filter(x=>x.status!=='مدفوع'&&Number(x.daysLate)>0).reduce((a,x)=>a+Number(x.remaining||0),0);return{contractTotal,remaining,paid,exp,overdue}}
function dashboard(){let t=totals(), cap=db.capital.reduce((a,x)=>a+(x.direction==='داخل'?1:-1)*Number(x.amount||0),0);let last=db.payments.slice(-7).reduce((a,x)=>{let k=iso(x.date);a[k]=(a[k]||0)+Number(x.amount||0);return a},{});let vals=Object.entries(last);let mx=Math.max(1,...vals.map(x=>x[1]));return `<div class="grid"><div class="card kpi"><div class="label">إجمالي قيمة العقود</div><div class="num">${money(t.contractTotal)}</div></div><div class="card kpi"><div class="label">إجمالي المتبقي</div><div class="num">${money(t.remaining)}</div></div><div class="card kpi"><div class="label">إجمالي التحصيل</div><div class="num">${money(t.paid)}</div></div><div class="card kpi"><div class="label">المتأخر</div><div class="num danger-text">${money(t.overdue)}</div></div></div><div class="grid panel"><div class="card kpi"><div class="label">عدد العملاء</div><div class="num">${db.customers.length}</div></div><div class="card kpi"><div class="label">عدد العقود</div><div class="num">${db.contracts.length}</div></div><div class="card kpi"><div class="label">المصاريف</div><div class="num">${money(t.exp)}</div></div><div class="card kpi"><div class="label">رصيد رأس المال</div><div class="num">${money(cap)}</div></div></div><div class="card panel"><h2>آخر التحصيلات</h2>${paymentTable(db.payments.slice(-8).reverse())}</div><div class="card panel"><h2>التحصيل الأخير</h2><div class="chart">${vals.length?vals.map(([k,v])=>`<div class="bar" style="height:${Math.max(8,v/mx*180)}px"><span>${money(v)}</span><small>${date(k)}</small></div>`).join(''):'<div class="empty">لا توجد تحصيلات بعد</div>'}</div></div>`}

function customerLookup(){
  return `<div class="card">
    <div class="notice">أدخل كود العميل كما هو، مثل <b>C-0001</b>، وسيتم عرض كل بيانات العميل المرتبطة بهذا الكود تلقائيًا.</div>
    <div class="form-grid">
      <div class="field">
        <label>كود العميل</label>
        <input id="customerLookupCode" type="text" placeholder="مثال: C-0001"
          oninput="lookupCustomer(this.value)" autocomplete="off">
      </div>
    </div>
    <div id="customerLookupResult" style="margin-top:16px">
      <div class="empty">أدخل كود العميل لعرض بياناته</div>
    </div>
  </div>`;
}

function lookupCustomer(rawCode){
  const code=(rawCode||'').trim().toUpperCase();
  const el=document.getElementById('customerLookupResult');
  if(!el)return;
  if(!code){
    el.innerHTML='<div class="empty">أدخل كود العميل لعرض بياناته</div>';
    return;
  }

  const c=db.customers.find(x=>String(x.code||'').toUpperCase()===code);
  if(!c){
    el.innerHTML='<div class="empty danger-text">لا يوجد عميل بهذا الكود.</div>';
    return;
  }

  const contracts=db.contracts.filter(x=>x.customerCode===c.code);
  const installments=db.installments.filter(x=>x.customerCode===c.code);
  const payments=db.payments.filter(x=>x.customerCode===c.code);
  const totalContracts=contracts.reduce((a,x)=>a+Number(x.total||0),0);
  const totalPaid=payments.reduce((a,x)=>a+Number(x.amount||0),0);
  const totalRemaining=contracts.reduce((a,x)=>a+Number(x.remaining||0),0);
  const overdue=installments.filter(x=>x.status!=='مدفوع'&&Number(x.daysLate)>0)
    .reduce((a,x)=>a+Number(x.remaining||0),0);

  el.innerHTML=`
    <div class="grid">
      <div class="card kpi"><div class="label">اسم العميل</div><div class="num" style="font-size:18px">${c.name||'-'}</div></div>
      <div class="card kpi"><div class="label">كود العميل</div><div class="num" style="font-size:18px">${c.code}</div></div>
      <div class="card kpi"><div class="label">إجمالي العقود</div><div class="num">${money(totalContracts)}</div></div>
      <div class="card kpi"><div class="label">إجمالي المدفوع</div><div class="num">${money(totalPaid)}</div></div>
      <div class="card kpi"><div class="label">إجمالي المتبقي</div><div class="num danger-text">${money(totalRemaining)}</div></div>
      <div class="card kpi"><div class="label">المتأخر</div><div class="num danger-text">${money(overdue)}</div></div>
    </div>

    <div class="card panel">
      <h2>بيانات العميل</h2>
      <div class="table-wrap"><table class="table"><tbody>
        <tr><th>كود العميل</th><td>${c.code}</td><th>اسم العميل</th><td>${c.name||''}</td></tr>
        <tr><th>رقم الموبايل</th><td>${c.phone||''}</td><th>العنوان</th><td>${c.address||''}</td></tr>
        <tr><th>تاريخ أول تعامل</th><td>${date(c.firstDate)}</td><th>التصنيف</th><td>${c.classification||''}</td></tr>
        <tr><th>الحالة</th><td><span class="badge ${c.status==='خامل'?'warn':c.status==='خالص'?'red':''}">${c.status||'نشط'}</span></td><th>ملاحظات</th><td>${c.notes||''}</td></tr>
      </tbody></table></div>
    </div>

    <div class="card panel">
      <h2>عقود العميل — عدد العقود: ${contracts.length}</h2>
      ${contracts.length ? contractTable(contracts,true) : '<div class="empty">لا توجد عقود لهذا العميل</div>'}
    </div>

    <div id="selectedCustomerContractInstallments"></div>

    <div class="card panel">
      <h2>سجل التحصيلات</h2>
      ${payments.length ? paymentTable(payments.slice().reverse()) : '<div class="empty">لا توجد تحصيلات لهذا العميل</div>'}
    </div>`;
}


function selectCustomerContract(contractId){
  const box=document.getElementById('selectedCustomerContractInstallments');
  if(!box)return;

  const c=db.contracts.find(x=>x.id===contractId);
  if(!c){
    box.innerHTML='';
    return;
  }

  const rows=db.installments.filter(x=>x.contractId===contractId);

  box.innerHTML=`<div class="card panel">
    <div class="actions" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="margin:0">جدول أقساط العقد ${c.id}</h2>
      <button class="btn mini" onclick="document.getElementById('selectedCustomerContractInstallments').innerHTML=''">إلغاء الاختيار</button>
    </div>
    <div class="notice">
      <b>العميل:</b> ${c.customerName} — <b>العقد:</b> ${c.id}
      — <b>إجمالي العقد:</b> ${money(c.total)}
      — <b>المتبقي:</b> ${money(c.remaining)}
    </div>
    ${rows.length ? instTable(rows) : '<div class="empty">لا توجد أقساط لهذا العقد</div>'}
  </div>`;
}

function customers(){updateCustomerStatuses();return `<div class="card"><div class="notice"><b>حالة العميل تلقائيًا:</b> <span class="badge">نشط</span> إذا لا توجد أقساط متأخرة، <span class="badge warn">خامل</span> إذا يوجد قسط متأخر، و<span class="badge red">خالص</span> عند سداد جميع العقود بالكامل.</div><input class="search" placeholder="ابحث بالاسم أو الكود أو الهاتف" oninput="filterTable(this,'customersTable')"><div class="actions" style="margin-bottom:10px"><button class="btn primary" onclick="customerForm()">+ إضافة عميل</button></div><div id="customersTable">${customerTable(db.customers)}</div></div>`}
function customerTable(rows){if(!rows.length)return '<div class="empty">لا توجد بيانات</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>الكود</th><th>الاسم</th><th>الهاتف</th><th>العقود</th><th>إجمالي العقود</th><th>المتبقي</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows.map(c=>{let cs=db.contracts.filter(x=>x.customerCode===c.code);return `<tr><td>${c.code}</td><td>${c.name}</td><td>${c.phone||''}</td><td><span class="badge">${cs.length} عقد</span></td><td>${money(cs.reduce((a,x)=>a+Number(x.total||0),0))}</td><td>${money(cs.reduce((a,x)=>a+Number(x.remaining||0),0))}</td><td><span class="badge ${c.status==='خامل'?'warn':c.status==='خالص'?'red':''}">${c.status||'نشط'}</span></td><td><div class="row-actions"><button class="btn mini" onclick="customerForm('${c.code}')">تعديل</button><button class="btn mini danger" onclick="delCustomer('${c.code}')">حذف</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function contracts(){return `<div class="card"><input class="search" placeholder="ابحث في العقود" oninput="filterTable(this,'contractsTable')"><div class="actions" style="margin-bottom:10px"><button class="btn primary" onclick="contractForm()">+ عقد جديد</button></div><div id="contractsTable">${contractTable(db.contracts)}</div></div>`}
function contractTable(rows,withSelect=false){
  if(!rows.length)return '<div class="empty">لا توجد عقود</div>';
  return `<div class="table-wrap"><table class="table"><thead><tr>
    <th>العقد</th><th>العميل</th><th>المنتج</th><th>إجمالي العقد</th><th>المقدم</th><th>القسط</th><th>المتبقي</th><th>اسم المحصل</th><th>ملاحظات</th><th>الحالة</th><th>إجراءات</th>
  </tr></thead><tbody>${rows.map(c=>`<tr>
    <td>${c.id}</td><td>${c.customerName}</td><td>${c.product}</td><td>${money(c.total)}</td><td>${money(c.downPayment)}</td><td>${money(c.monthly)}</td><td>${money(c.remaining)}</td>
    <td>${c.collectorName||''}</td><td>${c.notes||''}</td><td><span class="badge">${c.status}</span></td>
    <td>${withSelect?`<button class="btn mini primary" onclick="selectCustomerContract('${c.id}')">اختيار</button>`:''}
      <button class="btn mini" onclick="contractForm('${c.id}')">تعديل</button>
      <button class="btn mini danger" onclick="delContract('${c.id}')">حذف</button>
    </td>
  </tr>`).join('')}</tbody></table></div>`;
}
function installments(){return `<div class="card"><input class="search" placeholder="ابحث بالعميل أو العقد" oninput="filterTable(this,'instTable')"><div id="instTable">${instTable(db.installments)}</div></div>`}
function instTable(rows){
  return `<div class="table-wrap"><table class="table"><thead><tr>
    <th>العقد</th><th>العميل</th><th>#</th><th>الاستحقاق</th><th>قيمة القسط</th><th>المدفوع</th><th>المتبقي</th><th>التأخير</th><th>اسم المحصل</th><th>ملاحظات</th><th>الحالة</th>
  </tr></thead><tbody>${rows.map(x=>{
    let ps=db.payments.filter(p=>p.contractId===x.contractId&&Number(p.installmentNumber)===Number(x.number));
    let last=ps[ps.length-1];
    return `<tr><td>${x.contractId}</td><td>${x.customerName}</td><td>${x.number}</td><td>${date(x.dueDate)}</td><td>${money(x.amount)}</td><td>${money(x.paid)}</td><td>${money(x.remaining)}</td><td>${x.daysLate||0}</td><td>${last?.by||x.collectorName||''}</td><td>${last?.notes||x.notes||''}</td><td><span class="badge ${x.status==='مدفوع'?'':'warn'}">${x.status}</span></td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function payments(){
  updateCustomerStatuses();
  return `<div class="card">
    <div class="actions" style="margin-bottom:10px">
      <button class="btn primary" onclick="paymentForm()">+ تسجيل تحصيل</button>
      <button class="btn" onclick="dailyDueCollections()">استحقاق التحصيلات اليومية</button>
      <button class="btn" onclick="overdueCustomers()">المتأخرين</button>
    </div>
    <div class="field" style="margin-bottom:12px">
      <label>اسم العميل</label>
      <input id="paymentCustomerSearch" class="search" style="margin-bottom:0"
        placeholder="اكتب اسم العميل أو كود العميل لعرض سجله فقط"
        oninput="filterCustomerPayments(this.value)" autocomplete="off">
    </div>
    <div id="customerPaymentRecord">
      ${paymentTable(db.payments.slice().reverse())}
    </div>
  </div>`;
}

function filterCustomerPayments(value){
  const q=(value||'').trim().toLowerCase();
  const el=document.getElementById('customerPaymentRecord');
  if(!el)return;

  if(!q){
    el.innerHTML=paymentTable(db.payments.slice().reverse());
    return;
  }

  const rows=db.payments.slice().reverse().filter(p=>{
    const name=String(p.customerName||'').toLowerCase();
    const code=String(p.customerCode||'').toLowerCase();
    return name.includes(q) || code.includes(q);
  });

  if(!rows.length){
    el.innerHTML='<div class="empty">لا يوجد سجل تحصيل لهذا الاسم أو الكود.</div>';
    return;
  }

  const customerCodes=[...new Set(rows.map(x=>x.customerCode).filter(Boolean))];
  const title=customerCodes.length===1
    ? `سجل تحصيل العميل — ${rows[0].customerName||customerCodes[0]} (${customerCodes[0]})`
    : 'سجل التحصيلات المطابقة';

  el.innerHTML=`<div class="notice"><b>${title}</b> — عدد التحصيلات: ${rows.length} — إجمالي التحصيل: ${money(rows.reduce((a,x)=>a+Number(x.amount||0),0))}</div>${paymentTable(rows)}`;
}


function overdueCustomers(){
  updateCustomerStatuses();
  const today=new Date();
  today.setHours(0,0,0,0);

  const overdue=(db.installments||[]).filter(x=>{
    if(Number(x.remaining||0)<=0) return false;
    const due=new Date(x.dueDate);
    if(isNaN(due)) return false;
    due.setHours(0,0,0,0);
    return due < today;
  });

  const groups={};
  overdue.forEach(x=>{
    const key=x.customerCode||x.customerName||x.contractId;
    if(!groups[key]){
      groups[key]={
        customerCode:x.customerCode||'',
        customerName:x.customerName||'',
        installments:[],
        total:0,
        oldest:x.dueDate
      };
    }
    groups[key].installments.push(x);
    groups[key].total+=Number(x.remaining||0);
    if(String(x.dueDate)<String(groups[key].oldest)) groups[key].oldest=x.dueDate;
  });

  const customers=Object.values(groups).sort((a,b)=>String(a.oldest).localeCompare(String(b.oldest)));
  const total=customers.reduce((sum,x)=>sum+x.total,0);

  openModal('المتأخرين',`
    <div class="notice">
      <b>العملاء المتأخرون عن السداد:</b> ${customers.length}
      — إجمالي المبالغ المتأخرة: <b>${money(total)}</b>
    </div>
    ${customers.length ? `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>اسم العميل</th>
              <th>كود العميل</th>
              <th>عدد الأقساط المتأخرة</th>
              <th>أقدم استحقاق</th>
              <th>إجمالي المتأخر</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody>
            ${customers.map(c=>`
              <tr>
                <td>${c.customerName}</td>
                <td>${c.customerCode}</td>
                <td>${c.installments.length}</td>
                <td>${date(c.oldest)}</td>
                <td class="danger-text">${money(c.total)}</td>
                <td>
                  <button class="btn mini" onclick="closeModal();go('customerLookup');setTimeout(()=>{const el=document.getElementById('customerLookupCode');if(el){el.value='${String(c.customerCode).replace(/'/g,"\\'")}';lookupCustomer(el.value)}},0)">
                    ملف العميل
                  </button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    ` : '<div class="empty">لا يوجد عملاء متأخرون حاليًا.</div>'}
  `);
}

function dailyDueCollections(){
  const today=iso(new Date());
  const due=(db.installments||[])
    .filter(x=>iso(x.dueDate)===today && Number(x.remaining||0)>0)
    .sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate)));

  const total=due.reduce((sum,x)=>sum+Number(x.remaining||0),0);

  openModal('استحقاق التحصيلات اليومية',`
    <div class="notice">
      <b>تاريخ الاستحقاق اليوم:</b> ${date(today)}
      — عدد العملاء/الأقساط المستحقة: <b>${due.length}</b>
      — إجمالي المطلوب تحصيله: <b>${money(total)}</b>
    </div>
    ${due.length ? `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>العميل</th>
              <th>كود العميل</th>
              <th>العقد</th>
              <th>القسط</th>
              <th>قيمة القسط</th>
              <th>المتبقي</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody>
            ${due.map(x=>`
              <tr>
                <td>${x.customerName||''}</td>
                <td>${x.customerCode||''}</td>
                <td>${x.contractId||''}</td>
                <td>${x.number}</td>
                <td>${money(x.amount)}</td>
                <td>${money(x.remaining)}</td>
                <td><span class="badge warn">مستحق اليوم</span></td>
                <td><button class="btn mini primary" onclick="closeModal();paymentForm('${x.contractId}','${x.id}')">تحصيل</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    ` : '<div class="empty">لا توجد أقساط مستحقة للتحصيل اليوم.</div>'}
  `);
}
function paymentTable(rows){
  if(!rows.length)return '<div class="empty">لا توجد تحصيلات</div>';
  return `<div class="table-wrap"><table class="table"><thead><tr>
    <th>التاريخ</th><th>العميل</th><th>العقد</th><th>القسط</th><th>المبلغ</th><th>الطريقة</th><th>اسم المحصل</th><th>ملاحظات</th><th>إجراء</th>
  </tr></thead><tbody>${rows.map(x=>`<tr>
    <td>${date(x.date)}</td><td>${x.customerName}</td><td>${x.contractId}</td><td>${x.installmentNumber}</td><td>${money(x.amount)}</td><td>${x.method||''}</td><td>${x.by||''}</td><td>${x.notes||''}</td>
    <td><button class="btn mini danger" onclick="delPayment('${x.id}')">حذف</button></td>
  </tr>`).join('')}</tbody></table></div>`;
}
function expenses(){return `<div class="card"><div class="actions" style="margin-bottom:10px"><button class="btn primary" onclick="expenseForm()">+ إضافة مصروف</button></div>${simpleTable(db.expenses,['date','type','description','amount','method','notes'],['التاريخ','نوع المصروف','البيان','المبلغ','طريقة الدفع','ملاحظات'],'expense')}</div>`}
function capital(){return `<div class="card"><div class="actions" style="margin-bottom:10px"><button class="btn primary" onclick="capitalForm()">+ إضافة حركة</button></div>${simpleTable(db.capital,['date','type','direction','amount','description','balance'],['التاريخ','نوع الحركة','داخل/خارج','المبلغ','البيان','الرصيد'],'capital')}</div>`}
function simpleTable(rows,keys,heads,type){if(!rows.length)return '<div class="empty">لا توجد بيانات</div>';return `<div class="table-wrap"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}<th>إجراء</th></tr></thead><tbody>${rows.map(x=>`<tr>${keys.map(k=>`<td>${k==='date'||k==='balance'? (k==='balance'?money(x[k]):date(x[k])) : k==='amount'?money(x[k]):(x[k]??'')}</td>`).join('')}<td><button class="btn mini danger" onclick="delRow('${type}','${x.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function reports(){let t=totals(), paidByMethod={};db.payments.forEach(x=>paidByMethod[x.method||'غير محدد']=(paidByMethod[x.method||'غير محدد']||0)+Number(x.amount||0));let late=db.installments.filter(x=>x.status!=='مدفوع'&&Number(x.daysLate)>0);return `<div class="grid"><div class="card kpi"><div class="label">نسبة التحصيل من قيمة العقود</div><div class="num">${t.contractTotal?(t.paid/t.contractTotal*100).toFixed(1):0}%</div></div><div class="card kpi"><div class="label">نسبة المتبقي</div><div class="num">${t.contractTotal?(t.remaining/t.contractTotal*100).toFixed(1):0}%</div></div><div class="card kpi"><div class="label">عدد الأقساط المتأخرة</div><div class="num">${late.length}</div></div><div class="card kpi"><div class="label">إجمالي المصروفات</div><div class="num">${money(t.exp)}</div></div></div><div class="card panel"><h2>التحصيل حسب طريقة الدفع</h2>${Object.entries(paidByMethod).map(([k,v])=>`<p><b>${k}</b> — ${money(v)}</p>`).join('')||'<div class="empty">لا توجد بيانات</div>'}</div><div class="card panel"><h2>الأقساط المتأخرة</h2>${instTable(late)}</div>`}
function filterTable(input,id){let q=input.value.trim().toLowerCase();let rows=document.querySelectorAll('#'+id+' tbody tr');rows.forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${value??''}" ${extra}></div>`}

function paymentMethodSelect(name='method',value='نقدي',label='طريقة الدفع'){
  const v=value||'نقدي';
  return `<div class="field"><label>${label}</label><select name="${name}">
    <option value="نقدي" ${v==='نقدي'?'selected':''}>نقدي</option>
    <option value="إنستا" ${v==='إنستا'?'selected':''}>إنستا</option>
    <option value="فودفون كاش" ${v==='فودفون كاش'?'selected':''}>فودفون كاش</option>
  </select></div>`;
}


function customerForm(code){let c=db.customers.find(x=>x.code===code)||{};openModal(code?'تعديل عميل':'إضافة عميل',`<form onsubmit="saveCustomer(event,'${code||''}')"><div class="form-grid">${field('كود العميل','code',c.code||'','text',code?'readonly':'')}${field('اسم العميل','name',c.name)}${field('رقم الموبايل','phone',c.phone)}${field('العنوان','address',c.address)}${field('تاريخ أول تعامل','firstDate',iso(c.firstDate),'date')}${field('التصنيف','classification',c.classification||'A')}<div class="field" style="grid-column:1/-1"><label>ملاحظات</label><textarea name="notes">${c.notes||''}</textarea></div></div>${code?`<div class="notice">حالة العميل الحالية: <b>${c.status||'نشط'}</b> — يتم تحديثها تلقائيًا ولا يمكن تعديلها يدويًا.</div>`:''}<div class="actions" style="margin-top:15px">
<button class="btn primary">حفظ</button>
${code?`<button type="button" class="btn" onclick="closeModal();contractFormForCustomer('${code}')">+ إضافة عقد للعميل</button>`:''}
</div></form>`)}
function saveCustomer(e,old){e.preventDefault();let f=new FormData(e.target);let c={code:f.get('code')||uid('C'),name:f.get('name'),phone:f.get('phone'),address:f.get('address'),firstDate:f.get('firstDate'),classification:f.get('classification'),status:'نشط',notes:f.get('notes')};if(old){let i=db.customers.findIndex(x=>x.code===old);db.customers[i]=c}else db.customers.push(c);closeModal();save()}
function delCustomer(code){if(!confirm('حذف العميل؟ سيتم أيضًا حذف عقوده وأقساطه.'))return;db.customers=db.customers.filter(x=>x.code!==code);let ids=db.contracts.filter(x=>x.customerCode===code).map(x=>x.id);db.contracts=db.contracts.filter(x=>x.customerCode!==code);db.installments=db.installments.filter(x=>!ids.includes(x.contractId));db.payments=db.payments.filter(x=>x.customerCode!==code);save()}
function contractForm(id){let c=db.contracts.find(x=>x.id===id)||{};let opts=db.customers.map(x=>`<option value="${x.code}" ${x.code===c.customerCode?'selected':''}>${x.code} — ${x.name}</option>`).join('');openModal(id?'تعديل عقد':'إضافة عقد',`<form onsubmit="saveContract(event,'${id||''}')"><div class="form-grid"><div class="field"><label>العميل</label><select name="customerCode" required>${opts}</select></div>${field('المنتج','product',c.product)}${field('تكلفة المنتج','cost',c.cost||0,'number')}${field('المقدم','downPayment',c.downPayment||0,'number')}${field('مدة التقسيط بالشهور','months',c.months||12,'number')}${field('نسبة الربح','profitRate',c.profitRate||0,'number')} ${field('تاريخ بداية العقد','startDate',iso(c.startDate)||iso(new Date()),'date')}${field('أول استحقاق','firstDue',iso(c.firstDue),'date')}${field('اسم المحصل','collectorName',c.collectorName||'')}<div class="field" style="grid-column:1/-1"><label>ملاحظات</label><textarea name="notes">${c.notes||''}</textarea></div></div><div class="notice">
عند إنشاء عقد جديد سيُنشأ جدول الأقساط تلقائيًا بالقسط الشهري وإجمالي العقد.
إذا كان العميل لديه عقود سابقة، سيظل <b>كود العميل نفسه</b> ويتم إنشاء رقم عقد جديد مستقل.
</div>
<div class="actions">
<button class="btn primary">حفظ العقد</button>
${c.customerCode?`<button type="button" class="btn" onclick="closeModal();contractFormForCustomer('${c.customerCode}')">+ إضافة عقد آخر لنفس العميل</button>`:''}
</div></form>`)}

  const customer=db.customers.find(x=>x.code===customerCode);
  if(!customer){alert('العميل غير موجود');return;}
  let c={customerCode:customer.code,customerName:customer.name};

    </div>

        <textarea name="notes"></textarea>
      </div>
    </div>
    <div class="notice">سيتم إنشاء عقد جديد برقم مستقل، مع الاحتفاظ بنفس كود العميل. وسيظهر العقد تلقائيًا ضمن ملف العميل عند البحث بكوده.</div>
    <button class="btn primary">حفظ العقد</button>
  </form>`);
}

function saveContract(e,old){
  e.preventDefault();
  let f=new FormData(e.target),customer=db.customers.find(x=>x.code===f.get('customerCode'));
  if(!customer)return alert('العميل غير موجود');
  let cost=+f.get('cost')||0,down=+f.get('downPayment')||0,months=+f.get('months')||1,rate=+f.get('profitRate')||0;
  let net=cost-down,total=Math.round((net*(1+rate/100))*100)/100,monthly=Math.round(total/months*100)/100;
  let previousPayments=old?db.payments.filter(x=>x.contractId===old):[];
  let c={id:old||uid('CON'),customerCode:customer.code,customerName:customer.name,product:f.get('product'),cost,downPayment:down,net,months,profitRate:rate,total,remaining:total,monthly,startDate:f.get('startDate'),firstDue:f.get('firstDue'),status:'نشط',collectorName:f.get('collectorName')||'',notes:f.get('notes')||''};
  if(old){
    let i=db.contracts.findIndex(x=>x.id===old);
    if(i>=0)db.contracts[i]=c;
    db.installments=db.installments.filter(x=>x.contractId!==old);
  }else db.contracts.push(c);
  generateInstallments(c);
  if(previousPayments.length){
    previousPayments.forEach(p=>{
      let ins=db.installments.find(x=>x.contractId===c.id&&Number(x.number)===Number(p.installmentNumber));
      if(ins){
        let amt=Math.min(Number(p.amount||0),ins.remaining);
        ins.paid+=amt;ins.remaining=Math.max(0,ins.amount-ins.paid);
        ins.status=ins.remaining===0?'مدفوع':'مدفوع جزئي';
      }
    });
    c.remaining=Math.max(0,total-previousPayments.reduce((a,p)=>a+Number(p.amount||0),0));
    if(c.remaining===0)c.status='مكتمل';
  }
  closeModal();save();
}
function generateInstallments(c){let first=new Date(c.firstDue||c.startDate);for(let i=1;i<=c.months;i++){let d=new Date(first);d.setMonth(d.getMonth()+i-1);let amount=i===c.months?Math.round((c.total-c.monthly*(c.months-1))*100)/100:c.monthly;db.installments.push({id:uid('INS'),contractId:c.id,customerCode:c.customerCode,customerName:c.customerName,number:i,dueDate:d.toISOString().slice(0,10),amount,paid:0,remaining:amount,daysLate:0,collectorName:c.collectorName||'',notes:c.notes||'',status:'مستحق'})}}
function delContract(id){if(!confirm('حذف العقد وجدول أقساطه؟'))return;db.contracts=db.contracts.filter(x=>x.id!==id);db.installments=db.installments.filter(x=>x.contractId!==id);save()}
function paymentForm(selectedContractId='',selectedInstallmentId=''){
  let opts=db.contracts.map(c=>`<option value="${c.id}" ${c.id===selectedContractId?'selected':''}>${c.id} — ${c.customerName} — متبقي ${money(c.remaining)}</option>`).join('');
  openModal('تسجيل تحصيل',`<form onsubmit="savePayment(event)"><div class="form-grid"><div class="field"><label>العقد</label><select name="contractId" required onchange="fillInst(this.value)">${opts}</select></div><div class="field"><label>القسط</label><select name="installmentId" id="payInst" required></select></div>${field('التاريخ','date',iso(new Date()),'date')}${field('المبلغ','amount',0,'number')}${paymentMethodSelect('method','نقدي','طريقة الدفع')}${field('اسم المحصل','by')}${field('ملاحظات التحصيل','notes')}</div><div class="notice">طريقة الدفع المتاحة: نقدي — إنستا — فودفون كاش.</div><button class="btn primary" style="margin-top:15px">حفظ التحصيل</button></form>`);
  const cid=selectedContractId || (db.contracts[0]&&db.contracts[0].id);
  if(cid){
    fillInst(cid);
    if(selectedInstallmentId){
      const el=document.getElementById('payInst');
      if(el){
        el.value=selectedInstallmentId;
        const ins=db.installments.find(x=>x.id===selectedInstallmentId);
        const amount=document.querySelector('#modalBody input[name="amount"]');
        if(ins && amount) amount.value=ins.remaining;
      }
    }
  }
}
function fillInst(cid){let list=db.installments.filter(x=>x.contractId===cid&&x.remaining>0);let el=document.getElementById('payInst');if(!el)return;el.innerHTML=list.map(x=>`<option value="${x.id}">القسط ${x.number} — ${date(x.dueDate)} — ${money(x.remaining)}</option>`).join('');}
function savePayment(e){e.preventDefault();let f=new FormData(e.target),ins=db.installments.find(x=>x.id===f.get('installmentId')),c=db.contracts.find(x=>x.id===f.get('contractId')),amt=Math.min(+f.get('amount')||0,ins.remaining);if(!amt)return alert('أدخل مبلغًا صحيحًا');let p={id:uid('PAY'),date:f.get('date'),customerCode:c.customerCode,contractId:c.id,installmentNumber:ins.number,customerName:c.customerName,amount:amt,method:f.get('method'),by:f.get('by'),notes:f.get('notes')};db.payments.push(p);ins.paid+=amt;ins.remaining=Math.max(0,ins.amount-ins.paid);ins.status=ins.remaining===0?'مدفوع':'مدفوع جزئي';c.remaining=Math.max(0,c.remaining-amt);if(c.remaining===0)c.status='مكتمل';closeModal();save()}
function delPayment(id){let p=db.payments.find(x=>x.id===id);if(!p||!confirm('حذف التحصيل وإرجاع المبلغ للمتبقي؟'))return;let ins=db.installments.find(x=>x.contractId===p.contractId&&x.number===p.installmentNumber);let c=db.contracts.find(x=>x.id===p.contractId);if(ins){ins.paid=Math.max(0,ins.paid-p.amount);ins.remaining=ins.amount-ins.paid;ins.status=ins.remaining===0?'مدفوع':ins.paid>0?'مدفوع جزئي':'مستحق'}if(c)c.remaining+=p.amount;db.payments=db.payments.filter(x=>x.id!==id);save()}
function expenseForm(){openModal('إضافة مصروف',`<form onsubmit="saveExpense(event)"><div class="form-grid">${field('التاريخ','date',iso(new Date()),'date')}${field('نوع المصروف','type')}${field('البيان','description')}${field('المبلغ','amount',0,'number')}${paymentMethodSelect('method','نقدي','طريقة الدفع')}${field('ملاحظات','notes')}</div><button class="btn primary" style="margin-top:15px">حفظ</button></form>`)}
function saveExpense(e){e.preventDefault();let f=new FormData(e.target);db.expenses.push({id:uid('EXP'),date:f.get('date'),type:f.get('type'),description:f.get('description'),amount:+f.get('amount')||0,method:f.get('method'),notes:f.get('notes')});closeModal();save()}
function capitalForm(){openModal('إضافة حركة رأس مال',`<form onsubmit="saveCapital(event)"><div class="form-grid">${field('التاريخ','date',iso(new Date()),'date')}${field('نوع الحركة','type')}${field('المبلغ','amount',0,'number')}<div class="field"><label>داخل/خارج</label><select name="direction"><option>داخل</option><option>خارج</option></select></div>${field('البيان','description')}</div><button class="btn primary" style="margin-top:15px">حفظ</button></form>`)}
function saveCapital(e){e.preventDefault();let f=new FormData(e.target);db.capital.push({id:uid('CAP'),date:f.get('date'),type:f.get('type'),direction:f.get('direction'),amount:+f.get('amount')||0,description:f.get('description'),balance:0});let b=0;db.capital.forEach(x=>{b+=(x.direction==='داخل'?1:-1)*Number(x.amount||0);x.balance=b});closeModal();save()}
function delRow(type,id){if(!confirm('حذف السجل؟'))return;let map={expense:'expenses',capital:'capital'};db[map[type]]=db[map[type]].filter(x=>x.id!==id);save()}
function openQuick(){if(page==='customers')customerForm();else if(page==='contracts')contractForm();else if(page==='payments')paymentForm();else if(page==='expenses')expenseForm();else if(page==='capital')capitalForm();else go('customers')}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='بتاع_القسط_نسخة_احتياطية_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreFile(){document.getElementById('restoreInput').click()}document.getElementById('restoreInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.customers||!x.contracts)throw 0;if(confirm('استبدال البيانات الحالية بالنسخة؟')){db=x;save()}}catch{alert('ملف النسخة غير صالح')}};r.readAsText(f)};
render();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcYfHp9fJTH7juImew94DWz_tiKpF4xgA",
  authDomain: "abo-eldhab-group.firebaseapp.com",
  projectId: "abo-eldhab-group",
  storageBucket: "abo-eldhab-group.firebasestorage.app",
  messagingSenderId: "454135959190",
  appId: "1:454135959190:web:902ad852fe52923d58fcb7",
  measurementId: "G-8XS0FZDL40"
};

const app = initializeApp(firebaseConfig);
try { getAnalytics(app); } catch(e) {}
const auth = getAuth(app);
const firestore = getFirestore(app);
const stateRef = doc(firestore, "installmentApp", "state");
let currentUser = null;
let readyForSync = false;
let applyingRemote = false;
let syncTimer = null;

window.addEventListener('error',function(e){ if(e && e.message && /firebase|gstatic|module/i.test(e.message)){ setTimeout(function(){ setFirebaseStatus('err','تعذر تحميل مكونات فيرباس — افتح الموقع عبر HTTP وليس file://'); },50); } });

function setFirebaseStatus(type, text){
  const el=document.getElementById('firebaseStatus');
  if(!el) return;
  el.className='firebase-status'+(type?' '+type:'');
  const t=el.querySelector('.status-text');
  if(t) t.textContent=text;
}

async function startFirebase(){
  try{
    setFirebaseStatus('', 'جاري تسجيل الدخول إلى فيرباس...');
    await signInAnonymously(auth);
  }catch(error){
    console.error('Firebase Auth error:', error);
    setFirebaseStatus('local', 'الوضع المحلي — فعّل Anonymous Authentication');
  }
}

onAuthStateChanged(auth, async (user)=>{
  currentUser=user;
  if(!user){ readyForSync=false; return; }
  setFirebaseStatus('', 'جاري تحميل بيانات النظام من فيرباس...');
  try{
    const snap=await getDoc(stateRef);
    if(snap.exists()){
      applyingRemote=true;
      const remote=snap.data().db;
      if(remote && remote.customers && remote.contracts){
        window.setAppDb(remote);
        localStorage.setItem('installment_local_v1', JSON.stringify(remote));
        if(typeof updateCustomerStatuses==='function') updateCustomerStatuses();
        if(typeof render==='function') render();
      }
      applyingRemote=false;
    }else{
      await setDoc(stateRef,{db:window.getAppDb(),ownerUid:user.uid,updatedAt:new Date().toISOString()});
    }
    readyForSync=true;
    setFirebaseStatus('ok','متصل بفيرباس — البيانات محفوظة سحابيًا');
    onSnapshot(stateRef,(snapshot)=>{
      if(!snapshot.exists()) return;
      const data=snapshot.data();
      if(!data.db || applyingRemote) return;
      const localStamp=localStorage.getItem('installment_last_sync');
      const remoteStamp=data.updatedAt||'';
      if(!localStamp || remoteStamp>=localStamp){
        applyingRemote=true;
        window.setAppDb(data.db);
        localStorage.setItem('installment_local_v1',JSON.stringify(data.db));
        localStorage.setItem('installment_last_sync',remoteStamp);
        if(typeof updateCustomerStatuses==='function') updateCustomerStatuses();
        if(typeof render==='function') render();
        applyingRemote=false;
      }
    },(error)=>{
      console.error('Firestore listener error:',error);
      setFirebaseStatus('err','خطأ في مزامنة فيرباس');
    });
  }catch(error){
    console.error('Firestore load error:',error);
    readyForSync=false;
    setFirebaseStatus('err','تعذر الاتصال بقاعدة بيانات فيرباس');
  }
});

window.firebaseSyncSave=function(data){
  if(!currentUser || !readyForSync || applyingRemote) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    const stamp=new Date().toISOString();
    try{
      await setDoc(stateRef,{db:data,ownerUid:currentUser.uid,updatedAt:stamp});
      localStorage.setItem('installment_last_sync',stamp);
      setFirebaseStatus('ok','متصل بفيرباس — تم حفظ آخر تعديل');
    }catch(error){
      console.error('Firestore save error:',error);
      setFirebaseStatus('err','تعذر حفظ التعديل على فيرباس');
    }
  },250);
};
startFirebase();
</script>
